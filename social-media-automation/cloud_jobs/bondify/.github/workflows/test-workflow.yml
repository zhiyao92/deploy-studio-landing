name: Test Workflow (Dry-Run)

on:
  # Manual trigger only - for testing
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run Dry-Run Test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # #ops-automation by ID — see daily-post.yml.
          SLACK_APPROVAL_CHANNEL: 'C0BEGGSV4N6'
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BONDIFY_APP_STORE_URL: ${{ secrets.BONDIFY_APP_STORE_URL }}
          LLM_MODEL: 'claude-opus-4-8'
          AUTO_PUBLISH_INSTAGRAM: 'true'
          REQUIRE_SLACK_APPROVAL: 'false'
          DEBUG: 'true'
          DRY_RUN: 'true'
        run: .venv/bin/python3 bondify_workflow3_agent.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          retention-days: 7
